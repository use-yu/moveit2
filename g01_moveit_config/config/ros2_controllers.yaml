# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz；执行期间 /g01/joint_commands 目标周期为 5 ms

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    body_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - l_arm_joint1
      - l_arm_joint2
      - l_arm_joint3
      - l_arm_joint4
      - l_arm_joint5
      - l_arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - r_arm_joint1
      - r_arm_joint2
      - r_arm_joint3
      - r_arm_joint4
      - r_arm_joint5
      - r_arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
body_controller:
  ros__parameters:
    joints:
      - base_joint1
      - base_joint2
      - body_joint1
      - body_joint2
    # left_body/right_body 执行时轨迹只含 body_joint1/2，不含底盘关节；必须为 true
    allow_partial_joints_goal: true
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
