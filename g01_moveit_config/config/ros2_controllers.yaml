# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz；执行期间 /g01/joint_commands 目标周期为 5 ms

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    base_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    lift_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    waist_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints:
      - l_arm_joint1
      - l_arm_joint2
      - l_arm_joint3
      - l_arm_joint4
      - l_arm_joint5
      - l_arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
right_arm_controller:
  ros__parameters:
    joints:
      - r_arm_joint1
      - r_arm_joint2
      - r_arm_joint3
      - r_arm_joint4
      - r_arm_joint5
      - r_arm_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
base_controller:
  ros__parameters:
    joints:
      - base_joint1
      - base_joint2
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
lift_controller:
  ros__parameters:
    joints:
      - body_joint1
    # 躯干 action goal 已预先离散为 5 ms 点，禁止控制器再次样条插值。
    interpolation_method: none
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
waist_controller:
  ros__parameters:
    joints:
      - body_joint2
    # 躯干 action goal 已预先离散为 5 ms 点，禁止控制器再次样条插值，
    # 保证 /g01/joint_commands 和预下发 CSP 使用同一组点。
    interpolation_method: none
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
