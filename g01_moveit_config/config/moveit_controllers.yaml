# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - base_controller
    - lift_controller
    - waist_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - l_arm_joint1
      - l_arm_joint2
      - l_arm_joint3
      - l_arm_joint4
      - l_arm_joint5
      - l_arm_joint6
    action_ns: follow_joint_trajectory
    default: true
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - r_arm_joint1
      - r_arm_joint2
      - r_arm_joint3
      - r_arm_joint4
      - r_arm_joint5
      - r_arm_joint6
    action_ns: follow_joint_trajectory
    default: true
  base_controller:
    type: FollowJointTrajectory
    joints:
      - base_joint1
      - base_joint2
    action_ns: follow_joint_trajectory
    default: true
  lift_controller:
    type: FollowJointTrajectory
    joints:
      - body_joint1
    action_ns: follow_joint_trajectory
    default: true
  waist_controller:
    type: FollowJointTrajectory
    joints:
      - body_joint2
    action_ns: follow_joint_trajectory
    default: true
